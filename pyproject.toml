[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip-reframe"
version = "0.1.0"
description = "Speaker-aware vertical video reframing with LR-ASD"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python>=4.8,<5",
  "torch>=2.2,<3", "python-speech-features==0.6",
  "scenedetect>=0.6.3,<0.7", "tqdm>=4.66,<5"
]

[project.optional-dependencies]
mac = ["pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]
yolo = ["ultralytics>=8.4,<9"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
autoclip = "autoclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
